---
# ==============================================================================
# Role: nginx - Tasks
# ==============================================================================

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Configure Nginx reverse proxy
  ansible.builtin.template:
    src: library.conf.j2
    dest: /etc/nginx/sites-available/library.conf
    owner: root
    group: root
    mode: "0644"

- name: Enable library Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/library.conf
    dest: /etc/nginx/sites-enabled/library.conf
    state: link

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Ensure Nginx is running
  ansible.builtin.service:
    name: nginx
    state: restarted
    enabled: true
