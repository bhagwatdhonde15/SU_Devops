[smart_library]
# Replace with the public IPv4 address output by Terraform (e.g., 98.92.102.185)
98.92.102.185 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/library-aws-key ansible_python_interpreter=/usr/bin/python3

[smart_library:vars]
app_name=smart-library
app_port=5000
host_app_dir=/opt/library
host_data_dir=/opt/library/data
db_filename=library.db
